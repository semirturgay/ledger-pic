<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b8063" />
    <title>LedgerPic · Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6f5;
        --card: #fff;
        --text: #0e1a16;
        --muted: #6b7b75;
        --brand: #0f9d77;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f0d;
          --card: #111816;
          --text: #e8efec;
          --muted: #84958e;
          --brand: #22c38e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 18px;
        background: var(--card);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been saved on this device yet. Pages you've already opened still work offline.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
